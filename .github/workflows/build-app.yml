name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @pwabuilder/bubblewrap

      - name: Initialize Android Project
        run: |
          bubblewrap init --manifest=https://matric74500-tech.github.io/Suhail-Al-Makhzoun/manifest.json --directory=android-app || true

      - name: Build Android Package
        run: |
          cd android-app || mkdir -p android-app
          # بناء الحزمة مباشرة من مخرجات موقعك على نتليفاي أو جيت هب
